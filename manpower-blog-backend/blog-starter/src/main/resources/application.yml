spring:
  application:
    name: manpower-blog-backend

  profiles:
    active: dev

  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

  jackson:
    time-zone: Asia/Tokyo

  web:
    locale: ja_JP
    locale-resolver: fixed

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  # 値オブジェクトと列型を相互変換する TypeHandler の登録先。
  # エンティティ側で typeHandler を名指しすると domain -> infrastructure の
  # 依存が生まれるため、型単位のパッケージ登録で解決する。
  # モジュール追加時はカンマ区切りで追記すること。
  type-handlers-package: com.manpowergroup.blog.module.member.infrastructure.persistence.handler

server:
  port: 8080

  tomcat:
    threads:
      max: 200
      min-spare: 20

  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: "never"

logging:
  file:
    path: logs   # プロジェクトルート配下のログ出力先

  level:
    root: INFO
    org.springframework.web: INFO

# =========================================
# アプリケーション共通設定
# =========================================
app:
  trace-id:
    enabled: true   # true=有効 / false=無効
  page:
    default-page-num: 1
    default-page-size: 10
    max-page-size: 100


security:
  jwt:
    secret: "bXktZGV2LWp3dC1zZWNyZXQta2V5LWxlbmd0aC1tdXN0LWJlLTMyLWJ5dGVzIQ=="
    issuer: "springboot3web"
    expire-seconds: 7200
