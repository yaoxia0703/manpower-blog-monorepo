server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:manpower_blog}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PWD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

  web:
    locale: ja_JP
    locale-resolver: fixed

  jackson:
    time-zone: Asia/Tokyo

# 本番では既定値を持たせず、未設定なら起動を失敗させる。
# 開発用の既定値が本番へ紛れ込むことを防ぐため、application.yml の値を上書きする。
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

security:
  jwt:
    # 面ごとに別の環境変数を要求する。既定値を持たせないため、
    # いずれかが未設定なら起動時に失敗する。
    # 両者に同じ値を設定しないこと（分離が無効になる）。
    admin:
      secret: ${JWT_ADMIN_SECRET}
      issuer: ${JWT_ADMIN_ISSUER}
    member:
      secret: ${JWT_MEMBER_SECRET}
      issuer: ${JWT_MEMBER_ISSUER}
