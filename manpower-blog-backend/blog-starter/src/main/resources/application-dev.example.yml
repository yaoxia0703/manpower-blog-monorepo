server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: root
    password: your_local_password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 開発環境のみSQLを出力する
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    org.mybatis: DEBUG
    com.baomidou.mybatisplus: DEBUG
    com.manpowergroup.blog: DEBUG

security:
  jwt:
    # 必須。未設定のまま起動すると JwtTokenProvider が例外を送出する。
    # Base64 エンコードした 32 バイト以上の値を指定すること。
    #   例）openssl rand -base64 32
    #
    # 運用者面と会員面で必ず異なる鍵を指定すること。
    # 同じ値にすると、会員が自己登録して得たトークンが
    # 運用者面の署名検証を通過してしまう。
    # issuer は環境ごとにも変えることで、他環境で発行したトークンを弾ける。
    admin:
      secret: your_base64_encoded_secret_for_admin
      issuer: manpower-blog-admin-dev
    member:
      secret: your_base64_encoded_secret_for_member
      issuer: manpower-blog-member-dev
