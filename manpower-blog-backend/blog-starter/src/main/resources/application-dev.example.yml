server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: root
    password: your_local_password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 開発環境のみSQLを出力する
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    org.mybatis: DEBUG
    com.baomidou.mybatisplus: DEBUG
    com.manpowergroup.blog: DEBUG
